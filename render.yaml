# Credora on Render (free tier)
# Dashboard: https://dashboard.render.com → New → Blueprint → this repo
# Or: https://render.com/deploy?repo=https://github.com/KOlivier2119/credora
#
# Free web services spin down after 15 minutes idle (first request ~1 min).
# Free Postgres expires after 30 days and is limited to 1 GB / 1 database per workspace.
# Free web services cannot receive private-network traffic, so the API calls the
# AI service over its public *.onrender.com hostname.

databases:
  - name: credora-db
    databaseName: credora
    user: credora
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: credora-ai
    runtime: docker
    plan: free
    dockerfilePath: ./ai/Dockerfile
    dockerContext: ./ai
    healthCheckPath: /health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"

  - type: web
    name: credora-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: credora-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://credora-fawn.vercel.app
      - key: AI_SERVICE_URL
        fromService:
          name: credora-ai
          type: web
          property: host
      - key: CREDIT_BUREAU_MODE
        value: sandbox
      - key: SMS_MODE
        value: sandbox
